<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listenbrainz to youtube music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-1px);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }
        
        .status.loading {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .results {
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .progress {
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
            color: #666;
        }
        
        .track {
            background: #f8f9fa;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .track.searching {
            border-left-color: #ffc107;
        }
        
        .track.found {
            border-left-color: #28a745;
        }
        
        .track.not-found {
            border-left-color: #dc3545;
        }
        
        .track-number {
            font-weight: 700;
            color: #667eea;
            min-width: 30px;
        }
        
        .track-info {
            flex: 1;
        }
        
        .track-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }
        
        .track-artist {
            font-size: 13px;
            color: #666;
        }
        
        .track-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .track-status.searching {
            background: #fff3cd;
            color: #856404;
        }
        
        .track-status.found {
            background: #d4edda;
            color: #155724;
        }
        
        .track-status.not-found {
            background: #f8d7da;
            color: #721c24;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .actions button {
            flex: 1;
        }
        
        .download-btn {
            background: #28a745;
        }
        
        .download-btn:hover {
            background: #218838;
        }
        
        .note {
            background: #e7f3ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #004085;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 listenbrainz → youtube music</h1>
        <p class="subtitle">convert your listenbrainz playlists to youtube music .m3u files</p>
        
        <div class="note">
            💡 this tool searches youtube music for each track and creates a playlist file. due to browser limitations, it uses youtube's search to find the best matches.
        </div>
        
        <div class="input-group">
            <input 
                type="text" 
                id="playlistInput" 
                placeholder="paste listenbrainz playlist mbid or url..."
            >
            <button id="convertBtn" onclick="convertPlaylist()">convert</button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div id="progress" class="progress" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText"></div>
        </div>
        
        <div id="results" class="results">
            <div class="actions">
                <button class="download-btn" onclick="downloadM3U()">📥 download .m3u file</button>
            </div>
            <div id="trackList"></div>
        </div>
    </div>
    
    <script>
        let playlistData = {
            name: '',
            tracks: []
        };
        
        function extractMbid(input) {
            input = input.trim();
            const mbidRegex = /[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/;
            const match = input.match(mbidRegex);
            return match ? match[0] : input;
        }
        
        async function convertPlaylist() {
            const input = document.getElementById('playlistInput').value;
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            const trackList = document.getElementById('trackList');
            const btn = document.getElementById('convertBtn');
            const progress = document.getElementById('progress');
            
            if (!input) {
                showStatus('please enter a playlist mbid or url', 'error');
                return;
            }
            
            const mbid = extractMbid(input);
            
            btn.disabled = true;
            results.classList.remove('show');
            trackList.innerHTML = '';
            progress.style.display = 'none';
            playlistData.tracks = [];
            
            showStatus('fetching playlist from listenbrainz... 🎧', 'loading');
            
            try {
                const response = await fetch(`https://api.listenbrainz.org/1/playlist/${mbid}`);
                
                if (!response.ok) {
                    throw new Error('playlist not found or invalid mbid');
                }
                
                const data = await response.json();
                const tracks = data.playlist.track;
                playlistData.name = data.playlist.title || 'playlist';
                
                if (tracks.length === 0) {
                    showStatus('playlist is empty 😕', 'error');
                    btn.disabled = false;
                    return;
                }
                
                showStatus(`found ${tracks.length} tracks, searching youtube music...`, 'loading');
                progress.style.display = 'block';
                results.classList.add('show');
                
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    const title = track.title || 'unknown';
                    const artist = track.creator || 'unknown';
                    
                    const trackEl = addTrackToUI(i + 1, title, artist);
                    updateProgress(i, tracks.length);
                    
                    // add delay to avoid rate limiting
                    await new Promise(r => setTimeout(r, 500));
                    
                    const youtubeUrl = await searchYouTubeMusic(artist, title);
                    
                    playlistData.tracks.push({
                        title: title,
                        artist: artist,
                        url: youtubeUrl,
                        found: !!youtubeUrl
                    });
                    
                    updateTrackStatus(trackEl, youtubeUrl);
                }
                
                updateProgress(tracks.length, tracks.length);
                
                const foundCount = playlistData.tracks.filter(t => t.found).length;
                showStatus(`✓ done! found ${foundCount}/${tracks.length} tracks on youtube music`, 'success');
                btn.disabled = false;
                
            } catch (error) {
                showStatus(`error: ${error.message}`, 'error');
                btn.disabled = false;
                progress.style.display = 'none';
            }
        }
        
        function addTrackToUI(number, title, artist) {
            const trackList = document.getElementById('trackList');
            const trackEl = document.createElement('div');
            trackEl.className = 'track searching';
            trackEl.innerHTML = `
                <div class="track-number">${number}</div>
                <div class="track-info">
                    <div class="track-title">${escapeHtml(title)}</div>
                    <div class="track-artist">${escapeHtml(artist)}</div>
                </div>
                <div class="track-status searching">searching...</div>
            `;
            trackList.appendChild(trackEl);
            return trackEl;
        }
        
        function updateTrackStatus(trackEl, youtubeUrl) {
            const statusEl = trackEl.querySelector('.track-status');
            if (youtubeUrl) {
                trackEl.className = 'track found';
                statusEl.className = 'track-status found';
                statusEl.textContent = '✓ found';
            } else {
                trackEl.className = 'track not-found';
                statusEl.className = 'track-status not-found';
                statusEl.textContent = '✗ not found';
            }
        }
        
        async function searchYouTubeMusic(artist, title) {
            try {
                // create search query for youtube music
                const query = `${artist} ${title} music`;
                const encodedQuery = encodeURIComponent(query);
                
                // use youtube's internal api (innertube)
                const apiUrl = 'https://www.youtube.com/youtubei/v1/search?key=AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8';
                
                const requestBody = {
                    context: {
                        client: {
                            clientName: 'WEB_REMIX',
                            clientVersion: '1.20241008.01.00',
                            hl: 'en',
                            gl: 'US'
                        }
                    },
                    query: query,
                    params: 'EgWKAQIIAWoKEAoQAxAEEAkQBQ%3D%3D' // filter for songs
                };
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    console.log('api failed, trying alternative method');
                    return await searchYouTubeFallback(artist, title);
                }
                
                const data = await response.json();
                
                // parse the response to find video id
                const contents = data?.contents?.tabbedSearchResultsRenderer?.tabs?.[0]?.tabRenderer?.content?.sectionListRenderer?.contents;
                
                if (contents) {
                    for (const section of contents) {
                        const items = section?.musicShelfRenderer?.contents;
                        if (items && items.length > 0) {
                            const firstItem = items[0]?.musicResponsiveListItemRenderer;
                            const videoId = firstItem?.playlistItemData?.videoId || 
                                          firstItem?.overlay?.musicItemThumbnailOverlayRenderer?.content?.musicPlayButtonRenderer?.playNavigationEndpoint?.watchEndpoint?.videoId;
                            
                            if (videoId) {
                                return `https://music.youtube.com/watch?v=${videoId}`;
                            }
                        }
                    }
                }
                
                // if innertube fails, try fallback
                return await searchYouTubeFallback(artist, title);
                
            } catch (error) {
                console.error('search error:', error);
                return await searchYouTubeFallback(artist, title);
            }
        }
        
        async function searchYouTubeFallback(artist, title) {
            try {
                // fallback: scrape youtube search results
                const query = `${artist} ${title} official audio`;
                const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                
                const response = await fetch(searchUrl);
                const html = await response.text();
                
                // find video id from youtube search results page
                const videoIdPatterns = [
                    /"videoId":"([A-Za-z0-9_-]{11})"/g,
                    /watch\?v=([A-Za-z0-9_-]{11})/g
                ];
                
                for (const pattern of videoIdPatterns) {
                    const matches = [...html.matchAll(pattern)];
                    if (matches.length > 0) {
                        const videoId = matches[0][1];
                        return `https://music.youtube.com/watch?v=${videoId}`;
                    }
                }
                
                return null;
            } catch (error) {
                console.error('fallback search error:', error);
                return null;
            }
        }
        
        function updateProgress(current, total) {
            const percent = (current / total) * 100;
            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('progressText').textContent = `${current} / ${total} tracks processed`;
        }
        
        function downloadM3U() {
            let m3uContent = '#EXTM3U\n';
            m3uContent += `#PLAYLIST:${playlistData.name}\n\n`;
            
            playlistData.tracks.forEach(track => {
                if (track.found) {
                    m3uContent += `#EXTINF:-1,${track.artist} - ${track.title}\n`;
                    m3uContent += `${track.url}\n\n`;
                }
            });
            
            const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${sanitizeFilename(playlistData.name)}.m3u`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function sanitizeFilename(name) {
            return name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }
        
        document.getElementById('playlistInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                convertPlaylist();
            }
        });
    </script>
</body>
</html>
